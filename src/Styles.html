<style>
  :root {
    --bg: #0f172a;            /* topo marinho */
    --bg-app: #f1f5f9;        /* fundo geral */
    --card: #ffffff;
    --texto: #0f172a;
    --texto-suave: #64748b;
    --borda: #e2e8f0;
    --primaria: #2563eb;
    --primaria-esc: #1d4ed8;
    --receita: #16a34a;
    --receita-bg: #dcfce7;
    --despesa: #e11d48;
    --despesa-bg: #ffe4e6;
    --neutro: #334155;
    --radius: 16px;
    --sombra: 0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.06);
    --sombra-forte: 0 10px 30px rgba(15,23,42,.12);
    --max: 920px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-app);
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
  }
  h1, h2, h3 { margin: 0; }
  .hidden { display: none !important; }

  .app { max-width: var(--max); margin: 0 auto; padding-bottom: 84px; }

  /* Topbar */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: #fff; padding: 16px 18px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--sombra);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .brand-dot { width: 12px; height: 12px; border-radius: 50%;
    background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 0 0 3px rgba(251,191,36,.25); }
  .topbar-sub { font-size: 13px; opacity: .85; }

  /* Telas */
  .tela { display: none; padding: 16px; }
  .tela.ativa { display: block; }

  /* Cards */
  .card {
    background: var(--card); border: 1px solid var(--borda);
    border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
    box-shadow: var(--sombra);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-head h2 { font-size: 15px; color: var(--texto); }

  /* Formulário */
  .form .campo { display: block; margin-bottom: 14px; }
  .rotulo { display: block; font-size: 12px; font-weight: 600; color: var(--texto-suave);
    text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 12px 14px; font-size: 16px; color: var(--texto);
    border: 1px solid var(--borda); border-radius: 12px; background: #fff; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { border-color: var(--primaria); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .input-valor { font-size: 30px; font-weight: 700; text-align: center; padding: 16px; letter-spacing: .5px; }
  .campo-valor .input-valor { color: var(--despesa); }
  body.tipo-receita .campo-valor .input-valor { color: var(--receita); }

  /* Segmented (Despesa/Receita) */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #eef2f7;
    padding: 4px; border-radius: 14px; margin-bottom: 16px; }
  .seg-btn { border: none; background: transparent; padding: 12px; font-size: 15px; font-weight: 700;
    border-radius: 10px; cursor: pointer; color: var(--texto-suave); }
  .seg-btn[data-tipo="Despesa"].ativo { background: #fff; color: var(--despesa); box-shadow: var(--sombra); }
  .seg-btn[data-tipo="Receita"].ativo { background: #fff; color: var(--receita); box-shadow: var(--sombra); }

  /* Stepper */
  .stepper { display: grid; grid-template-columns: 44px 1fr 44px; align-items: stretch; gap: 0; }
  .stepper button { border: 1px solid var(--borda); background: #fff; font-size: 20px; cursor: pointer; }
  .stepper button:first-child { border-radius: 12px 0 0 12px; }
  .stepper button:last-child { border-radius: 0 12px 12px 0; }
  .stepper input { border-radius: 0; border-left: none; border-right: none; text-align: center; font-weight: 600; }
  .preview { font-size: 13px; color: var(--primaria-esc); background: #eff6ff;
    border-radius: 10px; padding: 8px 12px; margin: -6px 0 12px; }

  /* Botões */
  .btn-principal { width: 100%; padding: 15px; font-size: 16px; font-weight: 700; color: #fff;
    background: var(--primaria); border: none; border-radius: 12px; cursor: pointer; }
  .btn-principal:hover { background: var(--primaria-esc); }
  .btn-principal:disabled { opacity: .6; cursor: default; }
  .btn-secundario { width: 100%; padding: 13px; font-size: 15px; font-weight: 600; color: var(--texto);
    background: #eef2f7; border: none; border-radius: 12px; cursor: pointer; margin-top: 8px; }
  .link-btn { background: none; border: none; color: var(--primaria); font-weight: 600; font-size: 13px;
    cursor: pointer; padding: 4px 0; }
  .acoes { margin-top: 6px; }

  /* Lista de lançamentos */
  .lista-lanc { list-style: none; margin: 0; padding: 0; }
  .lanc { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--borda); }
  .lanc:last-child { border-bottom: none; }
  .lanc-ico { width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto; display: grid; place-items: center;
    font-weight: 700; font-size: 13px; }
  .lanc-ico.d { background: var(--despesa-bg); color: var(--despesa); }
  .lanc-ico.r { background: var(--receita-bg); color: var(--receita); }
  .lanc-main { flex: 1 1 auto; min-width: 0; }
  .lanc-desc { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lanc-meta { font-size: 12px; color: var(--texto-suave); }
  .lanc-valor { font-weight: 700; white-space: nowrap; }
  .lanc-valor.d { color: var(--despesa); }
  .lanc-valor.r { color: var(--receita); }
  .lanc-acoes { display: flex; gap: 6px; }
  .icon-btn { border: none; background: #f1f5f9; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 14px; }

  /* Tabbar */
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: #fff; border-top: 1px solid var(--borda); display: flex;
    max-width: var(--max); margin: 0 auto; box-shadow: 0 -2px 10px rgba(15,23,42,.05); }
  .tab { flex: 1; border: none; background: none; padding: 10px 6px 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--texto-suave);
    font-size: 12px; font-weight: 600; }
  .tab .tab-ico { font-size: 20px; line-height: 1; }
  .tab.ativo { color: var(--primaria); }

  /* Período */
  .periodo { padding: 14px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--borda); background: #fff; padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--texto-suave); cursor: pointer; }
  .chip.ativo { background: var(--primaria); border-color: var(--primaria); color: #fff; }
  .custom-datas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .custom-datas input { width: auto; flex: 1 1 130px; padding: 9px 10px; font-size: 14px; }
  .custom-datas span { color: var(--texto-suave); font-size: 13px; }
  .custom-datas .btn-secundario { width: auto; margin-top: 0; padding: 9px 16px; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--borda); border-radius: var(--radius);
    padding: 14px; box-shadow: var(--sombra); }
  .kpi-rot { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-suave); }
  .kpi-val { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .kpi-val.r { color: var(--receita); }
  .kpi-val.d { color: var(--despesa); }
  .kpi-var { font-size: 12px; font-weight: 600; margin-top: 3px; }
  .var-up { color: var(--receita); }
  .var-down { color: var(--despesa); }
  .var-flat { color: var(--texto-suave); }

  /* Gráficos */
  .grafico-card h2 { font-size: 15px; margin-bottom: 12px; }
  .grafico-wrap { position: relative; width: 100%; }
  .grafico-wrap.alto { height: 260px; }
  .grafico-wrap.medio { height: 220px; }
  .duas-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* Ranking / tabelas */
  .rank { list-style: none; margin: 8px 0 0; padding: 0; }
  .rank li { padding: 9px 0; border-bottom: 1px dashed var(--borda); }
  .rank li:last-child { border-bottom: none; }
  .rank-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rank-cat { font-weight: 600; }
  .rank-val { font-weight: 700; }
  .rank-sub { display: flex; justify-content: space-between; font-size: 12px; color: var(--texto-suave); margin-top: 3px; }
  .barra { height: 6px; background: #eef2f7; border-radius: 999px; margin-top: 6px; overflow: hidden; }
  .barra > i { display: block; height: 100%; border-radius: 999px; background: var(--primaria); }
  .barra.d > i { background: var(--despesa); }
  .barra.r > i { background: var(--receita); }

  .tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tabela th, .tabela td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--borda); }
  .tabela th { font-size: 11px; text-transform: uppercase; color: var(--texto-suave); letter-spacing: .3px; }
  .tabela td.num, .tabela th.num { text-align: right; white-space: nowrap; }
  .scroll-x { overflow-x: auto; }

  /* Indicadores */
  .indicadores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .indicador { text-align: center; }
  .indicador .kpi-val { font-size: 20px; }
  .indicador small { display: block; color: var(--texto-suave); font-size: 11px; margin-top: 4px; }

  .filtro-inline { display: flex; align-items: center; gap: 8px; }
  .filtro-inline select { width: auto; padding: 8px 10px; font-size: 13px; }

  .carregando { text-align: center; color: var(--texto-suave); padding: 40px 0; }

  /* Switch (despesa fixa) */
  .switch-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #f8fafc; border: 1px solid var(--borda); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; cursor: pointer; }
  .switch-linha strong { display: block; font-size: 14px; }
  .switch-linha small { color: var(--texto-suave); font-size: 12px; }
  .switch { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; transition: .2s; }
  .switch .slider::before { content: ''; position: absolute; height: 22px; width: 22px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s; box-shadow: var(--sombra); }
  .switch input:checked + .slider { background: var(--primaria); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  /* Tela Fixas */
  .destaque-fixas { background: linear-gradient(135deg, #0f172a, #1e3a8a); color: #fff; border: none; }
  .destaque-fixas .kpi-rot { color: rgba(255,255,255,.75); }
  .fixas-total { font-size: 34px; font-weight: 800; margin: 4px 0 6px; }
  .fixas-quebra { font-size: 13px; color: rgba(255,255,255,.85); }
  .fixa-item { padding: 12px 4px; border-bottom: 1px solid var(--borda); }
  .fixa-item:last-child { border-bottom: none; }
  .fixa-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .fixa-nome { font-weight: 600; }
  .fixa-nome small { display: block; font-weight: 400; color: var(--texto-suave); font-size: 12px; }
  .fixa-valor { font-weight: 700; white-space: nowrap; }
  .selo { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .selo.previsto { background: #fef9c3; color: #854d0e; }
  .selo.validado { background: var(--receita-bg); color: var(--receita); }
  .fixa-acoes { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .fixa-acoes input { width: 130px; padding: 8px 10px; font-size: 14px; }
  .btn-mini { border: none; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-mini.ok { background: var(--receita); color: #fff; }
  .btn-mini.ghost { background: #eef2f7; color: var(--texto); }
  .gerenciar-item { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--borda); }
  .gerenciar-item:last-child { border-bottom: none; }
  .gerenciar-item .g-main { flex: 1 1 auto; min-width: 0; }
  .gerenciar-item .g-main strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gerenciar-item .g-main small { color: var(--texto-suave); font-size: 12px; }
  .g-inativo { opacity: .5; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
    background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600;
    box-shadow: var(--sombra-forte); opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; max-width: 90%; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.erro { background: var(--despesa); }

  /* Modal */
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: grid; place-items: center; z-index: 70; padding: 20px; }
  .modal-box { background: #fff; border-radius: var(--radius); padding: 20px; width: 100%; max-width: 380px; box-shadow: var(--sombra-forte); }
  .modal-box h3 { margin-bottom: 14px; }
  .modal-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .modal-acoes .btn-secundario, .modal-acoes .btn-principal { margin-top: 0; }

  @media (min-width: 720px) {
    .kpis { grid-template-columns: repeat(4, 1fr); }
    .input-valor { font-size: 34px; }
  }
  @media (max-width: 560px) {
    .duas-colunas { grid-template-columns: 1fr; }
  }
</style>
